<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <!-- Side Brush (Behind Body) -->
    <g transform="translate(850, 150) scale(2.2)">
        <g>
            <path d="M 0 0 Q 30 -10 60 0" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" />
            <path d="M 60 0 L 78 -12 M 60 0 L 80 -6 M 60 0 L 81 0 M 60 0 L 80 6 M 60 0 L 78 12 M 60 0 L 73 -16 M 60 0 L 73 16 M 60 0 L 68 -18 M 60 0 L 68 18" stroke="#555555" stroke-width="1.2" stroke-linecap="round" />
        </g>
        <g transform="rotate(120)">
            <path d="M 0 0 Q 30 -10 60 0" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" />
            <path d="M 60 0 L 78 -12 M 60 0 L 80 -6 M 60 0 L 81 0 M 60 0 L 80 6 M 60 0 L 78 12 M 60 0 L 73 -16 M 60 0 L 73 16 M 60 0 L 68 -18 M 60 0 L 68 18" stroke="#555555" stroke-width="1.2" stroke-linecap="round" />
        </g>
        <g transform="rotate(240)">
            <path d="M 0 0 Q 30 -10 60 0" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" />
            <path d="M 60 0 L 78 -12 M 60 0 L 80 -6 M 60 0 L 81 0 M 60 0 L 80 6 M 60 0 L 78 12 M 60 0 L 73 -16 M 60 0 L 73 16 M 60 0 L 68 -18 M 60 0 L 68 18" stroke="#555555" stroke-width="1.2" stroke-linecap="round" />
        </g>
        <circle cx="0" cy="0" r="14" fill="#111111" />
        <circle cx="0" cy="0" r="6" fill="#e6c200" />
    </g>

    <!-- Main Body Background -->
    <circle cx="512" cy="512" r="500" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="12" />
    
    <!-- Outer Ring / Bumper Detail -->
    <circle cx="512" cy="512" r="480" fill="none" stroke="#404040" stroke-width="4" />
    <circle cx="512" cy="512" r="470" fill="none" stroke="#222222" stroke-width="2" />
    
    <!-- Top Sensor Tower / Button Area -->
    <rect x="362" y="150" width="300" height="450" rx="150" fill="#1e1e1e" />
    
    <!-- Inner Metallic Ring (Lidar/Camera Cover) -->
    <circle cx="512" cy="450" r="100" fill="#444444" stroke="#000000" stroke-width="8" />
    <circle cx="512" cy="450" r="90" fill="#555555" />
    <!-- Metallic gradient effect using simple paths -->
    <path d="M 430 450 A 82 82 0 0 1 594 450" fill="none" stroke="#888888" stroke-width="8" opacity="0.5" />
    
    <!-- Power Button Area -->
    <rect x="472" y="190" width="80" height="120" rx="40" fill="#111111" stroke="#333333" stroke-width="2" />
    <!-- Power Icon -->
    <path d="M 512 205 L 512 220 M 500 215 A 14 14 0 1 0 524 215" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Home Icon -->
    <path d="M 512 270 L 500 280 L 500 292 L 524 292 L 524 280 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <path d="M 495 283 L 512 267 L 529 283" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Text -->
    <text x="512" y="780" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="#ffffff" text-anchor="middle" letter-spacing="4">LoopSweep</text>
    
    <!-- Glossy Highlight for 3D effect -->
    <path d="M 112 512 A 400 400 0 0 1 912 512 A 400 200 0 0 0 112 512" fill="#ffffff" opacity="0.05" />
</svg>
